# Each push to master runs the checks. When the push changes the package.json version and npm does not have that
# version yet, the job stages it with `npm stage publish`. A maintainer then approves it with 2FA on npmjs.com
# (Staged Packages) or with `npm stage approve`, and only then is it public. Running the workflow by hand stages the
# current version without the version-change check, for a retry. npm trusted publishing authenticates the job
# (OIDC), so the repository holds no npm token, and its permission is stage-only.
name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11.15.0 or later, which `npm stage publish` needs. No cache: a poisoned cache in a publishing
      # job could read the OIDC token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Decide whether to stage
        id: version
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "keystone-mcp@$version" version --json > /dev/null 2>&1; then
            echo "keystone-mcp $version is already on npm; nothing to stage."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A staged version stays private until approval, so npm view cannot see it. Stage only when this push
          # changed the version; otherwise each later push would stage the same version again.
          if [[ -n "$BEFORE" ]] && git fetch --quiet --no-tags --depth=1 origin "$BEFORE" 2> /dev/null; then
            previous=$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
            if [[ "$previous" == "$version" ]]; then
              echo "This push did not change the version ($version); nothing to stage."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ "$version" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            latest=$(npm view keystone-mcp dist-tags.latest)
            if [[ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n 1)" != "$version" ]]; then
              echo "::error::package.json version $version is lower than latest $latest on npm."
              exit 1
            fi
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # prepublishOnly runs the tests and the build again; the steps above already did, so skip it.
      - if: steps.version.outputs.publish == 'true'
        run: npm stage publish --ignore-scripts --tag "${{ steps.version.outputs.tag }}"
